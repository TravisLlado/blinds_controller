[env:adafruit_qtpy_esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf, arduino
monitor_speed = 115200

; Ensures Arduino runs on the right core and with ESP32 awareness
build_flags =
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_ARCH_ESP32

; Force PlatformIO to use our corrected sdkconfig
board_build.sdkconfig = sdkconfig.adafruit_qtpy_esp32c3

; Ensure all libraries are found, even those with Arduino dependencies
lib_ldf_mode = deep+

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    arduino-libraries/NTPClient@^3.2.1