; PlatformIO Project Configuration File
; For ESP32-C3 Supermini RS485 Demo - Three-Actuator System with Hardware Blinds

[platformio]
default_envs = controller

; Common settings for all environments
[env]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
  -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
  -Wall
  -Wextra
  -I${sysenv.CREDENTIALS_INCLUDE}

[env:controller]
lib_deps =
  me-no-dev/ESPAsyncWebServer
  ayushsharma82/WebSerial
build_src_filter =
  +<controller.cpp>
  +<button.cpp>
  +<WebInfo.cpp>
  +<config.h>
  +<button.h>
  +<WebInfo.h>

[env:actuator1]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=1
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:actuator2]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=2
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:actuator3]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=3
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>
