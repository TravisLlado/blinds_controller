; PlatformIO Project Configuration File
; For ESP32-C3 Supermini RS485 Demo - Three-Actuator System with Hardware Blinds

[platformio]
default_envs = bedroom_controller

; Common settings for all environments
[env]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
  -std=gnu++11
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
  -Wall
  -Wextra
  -I${sysenv.CREDENTIALS_INCLUDE}

; Shared controller settings -- each room env below extends this and picks
; its room via BLINDS_ROOM (see ROOM_CONFIGS in config.h)
[controller]
lib_deps =
  me-no-dev/ESPAsyncWebServer@3.6.0
  ; Private fork of ayushsharma82/WebSerial 2.1.2 with the buffer flush fix
  https://github.com/TravisLlado/WebSerial.git#v2.1.2-fix2
build_src_filter =
  +<controller.cpp>
  +<button.cpp>
  +<WebInfo.cpp>
  +<config.h>
  +<button.h>
  +<WebInfo.h>

[env:bedroom_controller]
extends = controller
build_flags =
  ${env.build_flags}
  -DBLINDS_ROOM=BEDROOM

[env:living_room_controller]
extends = controller
build_flags =
  ${env.build_flags}
  -DBLINDS_ROOM=LIVINGROOM

[env:demo_controller]
extends = controller
build_flags =
  ${env.build_flags}
  -DBLINDS_ROOM=DEMO

[env:actuator1]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=1
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:actuator2]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=2
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:actuator3]
build_flags =
  ${env.build_flags}
  -DACTUATOR_ADDRESS=3
build_src_filter =
  +<actuator.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>
