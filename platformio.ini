; PlatformIO Project Configuration File
; For ESP32-C3 Supermini RS485 Demo - Three-Slave System with Hardware Blinds

[platformio]
default_envs = master

[env:master]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
build_src_filter = 
  +<master.cpp>
  +<button.cpp>
  +<timesync.cpp>
  +<config.h>
  +<button.h>
  +<timesync.h>

[env:slave1]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=1
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>

[env:slave2]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=2
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>

[env:slave3]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=3
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>

; Common settings for all environments
[env]
lib_deps =
  bblanchon/ArduinoJson@^6.21.3
  arduino-libraries/NTPClient
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  