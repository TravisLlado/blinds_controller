; PlatformIO Project Configuration File
; For ESP32-C3 Supermini RS485 Demo - Three-Slave System with Hardware Blinds

[platformio]
default_envs = master

[env:master]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
lib_deps =
  me-no-dev/ESPAsyncWebServer
  ayushsharma82/WebSerial
build_src_filter =
  +<master.cpp>
  +<button.cpp>
  +<WebInfo.cpp>
  +<config.h>
  +<button.h>
  +<WebInfo.h>

[env:slave1]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=1
  -std=gnu++17
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:slave2]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=2
  -std=gnu++17
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

[env:slave3]
platform = espressif32
board = adafruit_qtpy_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DSLAVE_ADDRESS=3
  -std=gnu++17
build_src_filter = 
  +<slave.cpp>
  +<button.cpp>
  +<blinds.cpp>
  +<config.h>
  +<button.h>
  +<blinds.h>
  +<fast_trig.h>

; Common settings for all environments
[env]
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  